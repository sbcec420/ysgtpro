<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mock Test</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: #f5f7fb;
            font-family: Arial, Helvetica, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: #222;
        }

        .container {
            width: 100%;
            max-width: 420px;
            background: #ffffff;
            border-radius: 15px;
            padding: 35px 25px;
            text-align: center;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
        }

        .icon {
            width: 75px;
            height: 75px;
            margin: 0 auto 20px;
            background: #f1f3f6;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 35px;
        }

        h1 {
            font-size: 26px;
            margin-bottom: 12px;
            color: #222;
        }

        .subtitle {
            font-size: 15px;
            line-height: 1.6;
            color: #666;
            margin-bottom: 25px;
        }

        .line {
            width: 50px;
            height: 3px;
            background: #ff0089;
            border-radius: 5px;
            margin: 0 auto 22px;
        }

        .message {
            font-size: 14px;
            line-height: 1.6;
            color: #555;
            margin-bottom: 20px;
        }

        .status {
            display: inline-block;
            background: #fff1f8;
            color: #e60079;
            padding: 9px 15px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
        }

        .thankyou {
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid #eeeeee;
            font-size: 14px;
            color: #777;
        }

        @media (max-width: 360px) {
            .container {
                padding: 30px 20px;
            }

            h1 {
                font-size: 23px;
            }

            .subtitle {
                font-size: 14px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="icon">
            📝
        </div>

        <h1>No Mock Test Available</h1>

        <div class="line"></div>

        <p class="subtitle">
            There is no mock test available right now.
        </p>

        <p class="message">
            New mock tests will be added soon.  
            Please check back later and keep preparing for your goal.
        </p>

        <div class="status">
            Coming Soon
        </div>

        <div class="thankyou">
            Thank You for your patience 💜<br><br>
            Keep Learning • Keep Practicing • Keep Improving 🎯
        </div>

    </div>

</body>
</html>
